<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монгол орны газарзүй - 8-р анги</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003366; /* Монгол орны хөх тэнгэр */
            --secondary: #f1c40f; /* Алтан нар */
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #003366 0%, #001a33 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        #quiz-container {
            background: white;
            padding: 40px; border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            width: 90%; max-width: 500px; text-align: center;
            position: relative; overflow: hidden;
        }

        /* Countdown Timer Ring */
        .timer-container {
            position: relative; width: 80px; height: 80px; margin: 0 auto 20px;
        }
        .timer-svg { transform: rotate(-90deg); width: 80px; height: 80px; }
        .timer-circle {
            fill: none; stroke: var(--secondary); stroke-width: 6;
            stroke-dasharray: 226; stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        #timer-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.5rem; font-weight: 700; color: var(--primary);
        }

        .progress-bar {
            width: 100%; height: 6px; background: #eee;
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        #progress-fill {
            width: 0%; height: 100%; background: var(--secondary);
            transition: width 0.4s ease;
        }

        h1 { font-family: 'Poppins', sans-serif; color: var(--primary); font-size: 1.8rem; margin-bottom: 10px; }
        .question { font-size: 1.3rem; font-weight: 700; color: #2c3e50; margin-bottom: 25px; min-height: 60px; }
        
        .options { display: grid; gap: 15px; }
        .option-btn {
            padding: 18px; border: 2px solid #edf2f7; border-radius: 15px;
            background: #fff; font-size: 1.1rem; cursor: pointer;
            transition: all 0.3s; outline: none; font-family: 'Lato', sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .option-btn:hover { border-color: var(--primary); background: #f0f7ff; transform: translateY(-2px); }

        #feedback-overlay {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; z-index: 100; pointer-events: none;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.2);
        }

        .hidden { display: none; }
        input[type="text"] {
            padding: 15px; width: 85%; border-radius: 12px; border: 2px solid #cbd5e0;
            font-size: 1.1rem; margin-bottom: 25px; text-align: center;
        }
        .start-btn {
            background: var(--primary); color: white; border: none;
            padding: 18px 50px; border-radius: 35px; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 51, 102, 0.3); transition: 0.3s;
        }
        .start-btn:hover { transform: scale(1.05); background: #004080; }
        .score-num { font-size: 4rem; font-weight: 900; color: var(--primary); }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="feedback-overlay"></div>

    <div id="setup-screen">
        <div style="font-size: 4rem; margin-bottom: 10px;">🇲🇳</div>
        <h1>Монгол орны газарзүй</h1>
        <p style="color: #64748b; margin-bottom: 30px;">8-р ангийн сурагчдын мэдлэг шалгах тест</p>
        <input type="text" id="student-name" placeholder="Таны нэр...">
        <br>
        <button class="start-btn animate__animated animate__pulse animate__infinite" onclick="startQuiz()">Эхлэх 🚀</button>
        <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 15px;">Асуулт бүр 20 секундын хугацаатай</p>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div class="timer-container">
            <svg class="timer-svg">
                <circle class="timer-circle" id="timer-circle" cx="40" cy="40" r="36"></circle>
            </svg>
            <div id="timer-text">20</div>
        </div>

        <div id="q-emoji" style="font-size: 3rem; margin-bottom: 10px;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="color: #2d3436;">Аялал дууслаа!</h2>
        <div class="score-num" id="final-score"></div>
        <p id="feedback-msg" style="font-size: 1.2rem; font-weight: 600; margin: 20px 0; line-height: 1.5;"></p>
        <p id="status-text" style="color: #64748b; font-style: italic;">Багшид үр дүнг илгээж байна...</p>
        <button onclick="location.reload()" style="background: #f1f5f9; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; margin-top: 20px;">Дахин эхлэх 🔄</button>
    </div>
</div>

<audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
<audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<script>
    const questions = [
        { q: "Монгол улсын газар нутгийн нийт талбай хэд вэ?", a: ["1,564,116 км²", "1,566,600 км²", "1,500,000 км²", "1,600,000 км²"], c: 0, e: "🗺️" },
        { q: "Монгол орны хамгийн өндөр цэг аль нь вэ?", a: ["Отгонтэнгэр", "Мөнххайрхан", "Хүйтэн оргил", "Сутай"], c: 2, e: "🏔️" },
        { q: "Монгол орны хамгийн урт мөрнийг нэрлээрэй.", a: ["Сэлэнгэ", "Орхон", "Хэрлэн", "Онон"], c: 1, e: "💧" },
        { q: "Монгол орны хамгийн том нуур (талбайгаар) аль нь вэ?", a: ["Хөвсгөл", "Увс нуур", "Хяргас нуур", "Буйр нуур"], c: 1, e: "🌊" },
        { q: "Монгол орны уур амьсгалын гол онцлог юу вэ?", a: ["Далайн уур амьсгал", "Эх газрын эрс тэс", "Дулаан чийглэг", "Сэрүүн"], c: 1, e: "☀️" },
        { q: "Монгол улс хэдэн аймагтай вэ?", a: ["18", "21", "22", "19"], c: 1, e: "🏙️" },
        { q: "Монгол орны хамгийн том байгалийн бүс аль нь вэ?", a: ["Ой хээрийн бүс", "Хээрийн бүс", "Говийн бүс", "Өндөр уулын"], c: 1, e: "🌾" },
        { q: "Хамгийн их мөсөн голтой нуруу аль нь вэ?", a: ["Хангайн нуруу", "Хэнтийн нуруу", "Монгол Алтайн нуруу", "Говь Алтай"], c: 2, e: "❄️" },
        { q: "Монгол улс газар нутгийн хэмжээгээр дэлхийд хэддүгээрт ордог вэ?", a: ["15", "18", "19", "20"], c: 1, e: "🌍" },
        { q: "Монгол орны хамгийн нам доор цэг аль вэ?", a: ["Хөх нуурын хотгор", "Дархадын хотгор", "Заг байдраг", "Алтайн цаадах говь"], c: 0, e: "📉" }
    ];

    let current = 0; let score = 0; let sName = "";
    let timeLeft = 20; let timerInterval;
    const circle = document.getElementById('timer-circle');
    const radius = circle.r.baseVal.value;
    const circumference = radius * 2 * Math.PI;

    function startQuiz() {
        sName = document.getElementById('student-name').value;
        if (!sName) return alert("Нэрээ оруулна уу!");
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 20;
        document.getElementById('timer-text').innerText = timeLeft;
        circle.style.strokeDashoffset = 0;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = timeLeft;
            
            // Animation for circle
            const offset = circumference - (timeLeft / 20) * circumference;
            circle.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                autoWrong();
            }
        }, 1000);
    }

    function showQuestion() {
        resetTimer();
        const q = questions[current];
        document.getElementById('q-emoji').innerText = q.e;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = ((current / questions.length) * 100) + "%";
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn animate__animated';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            container.appendChild(btn);
        });
    }

    function autoWrong() {
        // Time out logic
        const feedback = document.getElementById('feedback-overlay');
        feedback.innerHTML = '<span style="color:#e74c3c" class="animate__animated animate__shakeX">⏳ ХУГАЦАА ДУУССАН!</span>';
        document.getElementById('snd-wrong').play();
        
        setTimeout(() => {
            feedback.innerHTML = '';
            nextQuestion();
        }, 1500);
    }

    function checkAnswer(idx, btn) {
        clearInterval(timerInterval);
        const feedback = document.getElementById('feedback-overlay');
        const correctSnd = document.getElementById('snd-correct');
        const wrongSnd = document.getElementById('snd-wrong');

        if (idx === questions[current].c) {
            score++;
            btn.style.background = '#2ecc71'; btn.style.color = 'white';
            btn.classList.add('animate__pulse');
            feedback.innerHTML = '<span style="color:#27ae60" class="animate__animated animate__zoomIn">✅ ЗӨВ!</span>';
            correctSnd.play();
        } else {
            btn.style.background = '#e74c3c'; btn.style.color = 'white';
            btn.classList.add('animate__shakeX');
            feedback.innerHTML = '<span style="color:#e74c3c" class="animate__animated animate__shakeX">❌ БУРУУ!</span>';
            wrongSnd.play();
        }

        setTimeout(() => {
            feedback.innerHTML = '';
            nextQuestion();
        }, 1300);
    }

    function nextQuestion() {
        current++;
        if (current < questions.length) {
            showQuestion();
        } else {
            finish();
        }
    }

    function finish() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score + " / 10";
        document.getElementById('snd-win').play();

        let msg = "";
        if (score >= 9) msg = "Та бол Монгол орны газарзүйн жинхэнэ шинжээч! 🌟";
        else if (score >= 6) msg = "Сайн байна, эх орноо илүү сайн таньж мэдээрэй! 👍";
        else msg = "Мэдлэгээ батжуулж, дахин нэг оролдоорой! 💪";
        
        document.getElementById('feedback-msg').innerText = msg;

        // Formspree Integration (mpqbbpko)
        fetch("https://formspree.io/f/mpqbbpko", {
            method: 'POST',
            body: JSON.stringify({
                "Сурагч": sName,
                "Сэдэв": "8-р анги Газарзүй",
                "Оноо": score + "/10",
                "Дүгнэлт": msg
            }),
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        }).then(() => document.getElementById('status-text').innerText = "Багшид үр дүнг илгээлээ ✅");
    }
</script>
</body>
</html>
