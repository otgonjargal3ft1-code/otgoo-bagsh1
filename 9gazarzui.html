<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монгол орны эдийн засгийн газарзүй - 9-р анги</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50; /* Industry Dark */
            --accent: #f39c12; /* Gold/Economy */
            --success: #27ae60;
            --error: #e74c3c;
            --white: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        #quiz-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px; border-radius: 25px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.5);
            width: 90%; max-width: 500px; text-align: center;
            position: relative; overflow: hidden;
            border-top: 8px solid var(--accent);
        }

        /* Countdown Timer Ring */
        .timer-container {
            position: relative; width: 85px; height: 85px; margin: 0 auto 20px;
        }
        .timer-svg { transform: rotate(-90deg); width: 85px; height: 85px; }
        .timer-circle {
            fill: none; stroke: var(--accent); stroke-width: 6;
            stroke-dasharray: 245; stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        #timer-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.6rem; font-weight: 700; color: var(--primary);
        }

        .progress-bar {
            width: 100%; height: 8px; background: #dfe6e9;
            border-radius: 10px; margin-bottom: 25px; overflow: hidden;
        }
        #progress-fill {
            width: 0%; height: 100%; background: var(--accent);
            transition: width 0.4s ease;
        }

        h1 { font-family: 'Poppins', sans-serif; color: var(--primary); font-size: 1.6rem; margin-bottom: 5px; }
        .question { font-size: 1.25rem; font-weight: 700; color: #2d3436; margin-bottom: 25px; min-height: 70px; line-height: 1.4; }
        
        .options { display: grid; gap: 12px; }
        .option-btn {
            padding: 16px; border: 2px solid #ecf0f1; border-radius: 15px;
            background: #fff; font-size: 1rem; cursor: pointer;
            transition: all 0.2s; outline: none; font-weight: 500;
            color: #2c3e50;
        }
        .option-btn:hover { border-color: var(--accent); background: #fef9e7; transform: translateY(-2px); }

        #feedback-overlay {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; z-index: 100; pointer-events: none;
            text-shadow: 2px 5px 20px rgba(0,0,0,0.2);
        }

        .hidden { display: none; }
        input[type="text"] {
            padding: 15px; width: 80%; border-radius: 12px; border: 2px solid #ced4da;
            font-size: 1.1rem; margin-bottom: 25px; text-align: center; outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .start-btn {
            background: var(--primary); color: var(--accent); border: 2px solid var(--accent);
            padding: 18px 55px; border-radius: 35px; font-size: 1.3rem; cursor: pointer;
            font-weight: 700; transition: 0.3s; text-transform: uppercase;
        }
        .start-btn:hover { background: var(--accent); color: var(--primary); box-shadow: 0 0 20px rgba(243, 156, 18, 0.4); }
        .score-num { font-size: 4.5rem; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="feedback-overlay"></div>

    <div id="setup-screen">
        <div style="font-size: 4rem; margin-bottom: 15px;">🏗️</div>
        <h1>Монгол орны эдийн засгийн газарзүй</h1>
        <p style="color: #636e72; margin-bottom: 30px; font-weight: 500;">9-р ангийн мэдлэг бататгах тоглоом</p>
        <input type="text" id="student-name" placeholder="Овог нэрээ бичнэ үү...">
        <br>
        <button class="start-btn animate__animated animate__pulse animate__infinite" onclick="startQuiz()">Эхлэх 💰</button>
        <p style="font-size: 0.85rem; color: #b2bec3; margin-top: 20px;">Нэг асуултад 20 секунд</p>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div class="timer-container">
            <svg class="timer-svg">
                <circle class="timer-circle" id="timer-circle" cx="42.5" cy="42.5" r="39"></circle>
            </svg>
            <div id="timer-text">20</div>
        </div>

        <div id="q-emoji" style="font-size: 3rem; margin-bottom: 10px;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="color: #2d3436; margin-bottom: 0;">Шалгалт дууслаа</h2>
        <div class="score-num" id="final-score"></div>
        <p id="feedback-msg" style="font-size: 1.15rem; font-weight: 600; color: #2c3e50; margin: 15px 0;"></p>
        <p id="status-text" style="color: #a4b0be; font-style: italic; font-size: 0.9rem;">Үр дүнг системд илгээж байна...</p>
        <button onclick="location.reload()" style="background: #f1f2f6; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: bold; color: #2f3542;">Дахин оролдох 🔄</button>
    </div>
</div>

<audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
<audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<script>
    const questions = [
        { q: "Монгол улсын эдийн засгийн тэргүүлэх салбар аль нь вэ?", a: ["Хөдөө аж ахуй", "Уул уурхай", "Аялал жуулчлал", "Тээвэр холбоо"], c: 1, e: "⛏️" },
        { q: "Эрдэнэт үйлдвэр ямар ашигт малтмал олборлож, баяжуулдаг вэ?", a: ["Алт, мөнгө", "Нүүрс", "Зэс, молибден", "Төмрийн хүдэр"], c: 2, e: "🏭" },
        { q: "Монгол улсын хамгийн том нүүрсний орд аль нь вэ?", a: ["Нарийн сухайт", "Шивээ-Овоо", "Таван толгой", "Багануур"], c: 2, e: "🚛" },
        { q: "Монгол улсын гадаад худалдааны хамгийн том түнш аль улс вэ?", a: ["ОХУ", "БНХАУ", "Япон", "АНУ"], c: 1, e: "🤝" },
        { q: "Монгол улсын эрчим хүчний системийн гол тулгуур юу вэ?", a: ["Усан цахилгаан станц", "Дулааны цахилгаан станц", "Нарны станц", "Салхины станц"], c: 1, e: "⚡" },
        { q: "Ноолуурын үйлдвэрлэлээр Монгол улс дэлхийд хэддүгээрт ордог вэ?", a: ["1", "2", "3", "5"], c: 1, e: "🧶" },
        { q: "Оюу толгой орд ямар аймагт байрладаг вэ?", a: ["Дорноговь", "Өмнөговь", "Дундговь", "Говь-Алтай"], c: 1, e: "💎" },
        { q: "Монгол улсын тээврийн салбарт ачаа эргэлтээр аль нь тэргүүлдэг вэ?", a: ["Агаарын тээвэр", "Авто тээвэр", "Төмөр замын тээвэр", "Усан тээвэр"], c: 2, e: "🚂" },
        { q: "Хөнгөн үйлдвэрийн гол түүхий эд юу вэ?", a: ["Ашигт малтмал", "Мал аж ахуйн гаралтай түүхий эд", "Мод", "Хуванцар"], c: 1, e: "👞" },
        { q: "Монгол улсын ДНБ гэж юу вэ?", a: ["Нийт малын тоо", "Дотоодын нийт бүтээгдэхүүн", "Гадаад өр", "Төсвийн алдагдал"], c: 1, e: "📈" }
    ];

    let current = 0; let score = 0; let sName = "";
    let timeLeft = 20; let timerInterval;
    const circle = document.getElementById('timer-circle');
    const circumference = 39 * 2 * Math.PI;

    function startQuiz() {
        sName = document.getElementById('student-name').value;
        if (!sName) return alert("Нэрээ оруулна уу!");
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        circle.style.strokeDasharray = circumference;
        showQuestion();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 20;
        document.getElementById('timer-text').innerText = timeLeft;
        circle.style.strokeDashoffset = 0;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = timeLeft;
            const offset = circumference - (timeLeft / 20) * circumference;
            circle.style.strokeDashoffset = offset;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleFeedback(false, null, true);
            }
        }, 1000);
    }

    function showQuestion() {
        resetTimer();
        const q = questions[current];
        document.getElementById('q-emoji').innerText = q.e;
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-fill').style.width = ((current / questions.length) * 100) + "%";
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn animate__animated';
            btn.innerText = opt;
            btn.onclick = () => handleFeedback(idx === q.c, btn);
            container.appendChild(btn);
        });
    }

    function handleFeedback(isCorrect, btn, isTimeout = false) {
        clearInterval(timerInterval);
        const feedback = document.getElementById('feedback-overlay');
        const correctSnd = document.getElementById('snd-correct');
        const wrongSnd = document.getElementById('snd-wrong');

        if (isCorrect) {
            score++;
            btn.style.background = '#2ecc71'; btn.style.color = 'white'; btn.style.borderColor = '#27ae60';
            btn.classList.add('animate__pulse');
            feedback.innerHTML = '<span style="color:#27ae60" class="animate__animated animate__zoomIn">✅ ЗӨВ!</span>';
            correctSnd.play();
        } else {
            if(btn) { btn.style.background = '#e74c3c'; btn.style.color = 'white'; btn.classList.add('animate__shakeX'); }
            feedback.innerHTML = isTimeout ? '<span style="color:#e74c3c" class="animate__animated animate__shakeX">⏳ ХУГАЦАА ДУУССАН!</span>' : '<span style="color:#e74c3c" class="animate__animated animate__shakeX">❌ БУРУУ!</span>';
            wrongSnd.play();
        }

        setTimeout(() => {
            feedback.innerHTML = '';
            current++;
            if (current < questions.length) showQuestion();
            else finish();
        }, 1400);
    }

    function finish() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score + " / 10";
        document.getElementById('snd-win').play();

        let msg = "";
        if (score >= 9) msg = "Та бол ирээдүйн чадварлаг эдийн засагч юм! 🌟";
        else if (score >= 6) msg = "Сайн байна, Монгол улсынхаа хөгжилд мэдлэгээрээ хувь нэмэр оруулаарай! 👍";
        else msg = "Эдийн засгийн газарзүйг дахин нэг нягтлан судлаарай! 💪";
        
        document.getElementById('feedback-msg').innerText = msg;

        fetch("https://formspree.io/f/mpqbbpko", {
            method: 'POST',
            body: JSON.stringify({
                "Сурагч": sName,
                "Сэдэв": "9-р анги Эдийн засгийн газарзүй",
                "Оноо": score + "/10",
                "Дүгнэлт": msg
            }),
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        }).then(() => document.getElementById('status-text').innerText = "Үр дүнг багшид илгээлээ ✅");
    }
</script>
</body>
</html>
